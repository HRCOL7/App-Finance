<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover deixa o app ocupar a tela toda (até atrás do entalhe); as áreas seguras são tratadas no CSS. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Cofre Finanças</title>
<!-- Fontes: o app tenta baixar do Google Fonts. Sem internet, usa as fontes de reserva do sistema.
     Para funcionar 100% offline, veja a seção "Fontes offline" do GUIA-DE-ESTUDO.md. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- ESTRUTURA DA PÁGINA
     .app    = coluna central com topo + conteúdo
     #view   = a única área que muda: o JavaScript escreve aqui a tela da aba atual -->
<div class="app" id="app">
  <header class="top">
    <div class="brand">Cofre<span>.</span></div>
    <div class="month" aria-label="Mês">
      <button data-a="prevMonth" aria-label="Mês anterior"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <b id="monthLabel" class="num"></b>
      <button data-a="nextMonth" aria-label="Próximo mês"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
  </header>
  <main id="view" aria-live="polite"></main>
</div>

<!-- BARRA DE ABAS: cada botão tem data-a="tab" e data-tab="nome". O JS escuta o clique
     e troca a tela (veja o objeto A, ação "tab"). -->
<nav class="nav" aria-label="Principal">
  <div class="nav-in">
    <button class="tab" data-a="tab" data-tab="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>Início</button>
    <button class="tab" data-a="tab" data-tab="gastos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Gastos</button>
    <button class="tab" data-a="tab" data-tab="cartoes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18M7 15h3"/></svg>Cartões</button>
    <button class="tab" data-a="tab" data-tab="dividas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l6 6 4-4 8 8"/><path d="M15 17h6v-6"/></svg>Dívidas</button>
    <button class="tab" data-a="tab" data-tab="plano"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v9h9"/><path d="M20.5 15A9 9 0 1 1 9 3.5"/></svg>Plano</button>
  </div>
</nav>

<!-- GAVETA: começa escondida (hidden). openSheet() escreve o formulário dentro de #sheet e a mostra. -->
<div class="backdrop" id="backdrop" data-a="closeSheet" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<!-- AVISO temporário ("Gasto registrado", "Desfazer"). -->
<div class="toast" id="toast" role="status" hidden></div>
<!-- BOTÃO FLUTUANTE: o texto e a ação mudam conforme a aba (veja render() e A.fab). -->
<button class="fab" id="fab" data-a="fab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span id="fabLabel">Novo gasto</span></button>
<!-- ABERTURA: logo "$". Some sozinha por CSS; tocar nela também fecha (A.skipSplash). -->
<div class="splash" data-a="skipSplash" aria-hidden="true"><div class="logo">$</div><div class="wm">Cofre</div><div class="tg">Seu dinheiro em ordem</div><div class="ld"><i></i></div></div>

<script src="app.js"></script>
</body>
</html>
